services:
  web:
    build: .
    ports:
      - "4242:4242"
    env_file:
      - .env
    volumes:
      - .:/low-code-modeler
      - /low-code-modeler/node_modules

  camunda-engine:
    image: planqk/camunda-process-view-plugins:v1.0.2
    # The process-view plugin calls its own REST API at the host:port the
    # browser used (e.g. localhost:8090), so the container must listen on
    # the same port it is published on.
    environment:
      SERVER_PORT: 8090
    ports:
      - 8090:8090

  backend:
    image: stiliala/collaboration-backend:latest
    ports:
      - "1234:1234"

  server:
    image: ghcr.io/qunicorn/qunicorn-core:main
    environment:
      CONTAINER_MODE: server
      SERVER_PORT: 8080
      BROKER_URL: "redis://broker:6379"
      DB_URL: "postgresql+psycopg://postgres:passwd@postgres-qunicorn:5432/qunicorn"
      JWKS_URL: "http://keycloak:8080/auth/realms/qunicorn/protocol/openid-connect/certs"
      NUMBA_CACHE_DIR: "/app/cache"
    depends_on:
      - postgres-qunicorn
      - broker
    ports:
      - "8080:8080"
    labels:
      kompose.service.expose: "true"
      kompose.service.type: "loadbalancer"

  worker-qunicorn:
    image: ghcr.io/qunicorn/qunicorn-core:main
    environment:
      CONTAINER_MODE: worker
      BROKER_URL: "redis://broker:6379"
      DB_URL: "postgresql+psycopg://postgres:passwd@postgres-qunicorn:5432/qunicorn"
      NUMBA_CACHE_DIR: "/app/cache"
      # QMWARE_API_KEY: ""
      # QMWARE_API_KEY_ID: ""
    depends_on:
      - postgres-qunicorn
      - broker
    ports:
      - "6379"

  keycloak_postgres:
    image: postgres:15
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: passwd
    hostname: local
    restart: always
    volumes:
      - /keycloak_pgdata:/var/lib/postgresql/data
    ports:
      - "5439:5432"

  keycloak:
    image: quay.io/keycloak/keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      DB_VENDOR: postgres
      DB_ADDR: keycloak_postgres
      DB_PORT: 5432
      DB_SCHEMA: public
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_PASSWORD: passwd
      KEYCLOAK_USER: kc_user
      KEYCLOAK_PASSWORD: kc_pass
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_PROXY_MODE: edge
      KC_METRICS_ENABLED: true
      KC_HTTP_ENABLED: true
      #KEYCLOAK_IMPORT: /opt/keycloak/data/import/keycloak-realm-export.json
    ports:
      # 8081 is taken by the OpenTOSCA Container (8081-8087)
      - "8180:8080"
    volumes:
      - ./resources/keycloak-realm-export.json:/opt/keycloak/data/import/keycloak-realm-export.json
    depends_on:
      - keycloak_postgres
    restart: always

  broker:
    image: redis:7
    ports:
      - "6379:6379"

  postgres-qunicorn:
    image: postgres:16
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_PASSWORD: passwd
      POSTGRES_DB: qunicorn
    volumes:
      - pgdata:/var/lib/postgresql/data \
    ports:
      - "5432:5432"

  ## Low-Code
  leqo-backend:
    # to build from a local clone instead, see docker-compose.override.example.yml
    image: ghcr.io/leqo-framework/leqo-backend:main
    environment:
      POSTGRES_USER: leqo
      POSTGRES_PASSWORD: unsave_passwd
      POSTGRES_DB: qasm
      POSTGRES_PORT: 5432
      POSTGRES_HOST: postgres-backend
      SQLALCHEMY_DRIVER: postgresql+psycopg
      QISKIT_COMPAT_MODE: TRUE
    depends_on:
      - postgres-backend
    ports:
      - "8000:80"

  postgres-backend:
    image: postgres:latest
    shm_size: 128mb
    environment:
      POSTGRES_USER: leqo
      POSTGRES_PASSWORD: unsave_passwd
      POSTGRES_DB: qasm
    ports:
      - "5435:5432"

  redis:
    image: redis:7
    ports:
      - "6378:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: stiliala/worker:latest
    env_file:
      - .env
    ports:
      - 3000:3000
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma migrate deploy &&
        npx prisma generate &&
        npm run dev:api
      "

  worker:
    image: stiliala/worker:latest
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://app:app@postgres:5432/app
      REDIS_URL: redis://redis:6379
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
        npx prisma generate &&
        npm run dev:worker
      "

  #######################
  ### OpenTOSCA Ecosystem ###
  # Optional, only started with the "opentosca" profile:
  #   docker compose --profile opentosca up -d
  # (or permanently via docker-compose.override.yml, see
  # docker-compose.override.example.yml)
  # Set PUBLIC_HOSTNAME in .env to the host's IP (not localhost), because the
  # Container and Winery must reach each other through the published ports.
  container:
    profiles: [opentosca]
    image: opentosca/container:v3.1.6
    ports:
      - "1337:1337"
      - "8081-8087:8081-8087"
    environment:
      CONTAINER_HOSTNAME: ${PUBLIC_HOSTNAME}
      ENGINE_IA_HOSTNAME: engine-ia-jdk8
      ENGINE_IA_PORT: 8080
      ENGINE_IA_JAVA17_HOSTNAME: engine-ia-jdk17
      ENGINE_IA_JAVA17_PORT: 8080
      ENGINE_PLAN_BPEL_HOSTNAME: engine-plan
      CONTAINER_DEPLOYMENT_TESTS: "false"

  engine-plan:
    profiles: [opentosca]
    image: opentosca/ode:v2.4.0
    ports:
      - "9763:9763"

  engine-ia-jdk8:
    profiles: [opentosca]
    image: opentosca/engine-ia:v2.1.0
    ports:
      - "8091:8080"

  engine-ia-jdk17:
    profiles: [opentosca]
    image: opentosca/engine-ia:latest-jdk17
    ports:
      - "7424:8080"

  winery:
    profiles: [opentosca]
    # Winery with docker/initialized-winery/tosca-definitions baked in
    build: ./docker/initialized-winery
    ports:
      - "8093:8080"
    environment:
      WINERY_HOSTNAME: ${PUBLIC_HOSTNAME}
      WORKFLOWMODELER_HOSTNAME: ${PUBLIC_HOSTNAME}
      TOPOLOGYMODELER_HOSTNAME: ${PUBLIC_HOSTNAME}
      CONTAINER_HOSTNAME: ${PUBLIC_HOSTNAME}

  opentosca-ui:
    profiles: [opentosca]
    image: opentosca/ui:latest
    environment:
      API_ENDPOINT_HOST: ${PUBLIC_HOSTNAME}
      API_ENDPOINT_PORT: 1337
      WINERY_HOST: ${PUBLIC_HOSTNAME}
      WINERY_PORT: 8093
    ports:
      - "8088:8080"

  # Docker engine the Container deploys the service containers into
  # (referenced as tcp://dind:2375 in the generated topologies, see src/winery.ts)
  dind:
    profiles: [opentosca]
    image: docker:20.10-dind
    privileged: true
    environment:
      - DOCKER_TLS_CERTDIR=
    ports:
      - "2222:2375"
      - "9990-9999:9990-9999"
      - "9990-9999:9990-9999/udp"
  # end of OpenTOSCA Ecosystem
  #######################

volumes:
  postgres_data:
  pgdata:
  keycloak_pgdata:
  db-data:
